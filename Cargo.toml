[package]
name = "snipping"
version = "1.0.0"
edition = "2021"
description = "A fast, native macOS snipping tool modeled on the Windows Snipping Tool"
authors = ["nomadslayer"]
repository = "https://github.com/nomadslayer/mac-snipping"
homepage = "https://github.com/nomadslayer"

[[bin]]
name = "snipping"
path = "src/main.rs"

[workspace]
members = ["xtask"]

[dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-vision = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-uniform-type-identifiers"] }
objc2-av-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-image-io = "0.3.2"
objc2-service-management = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
